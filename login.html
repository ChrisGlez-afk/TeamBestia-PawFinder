    <link rel="stylesheet" href="CSS/bootstrap.min.css">
    <link rel="stylesheet" href="CSS/estilo.css">

    <link rel="stylesheet" href="CSS/estiloFormularios.css">
</head>
<body>
    
    <header class="cabecera-fija">
        <nav class="navbar navbar-expand-lg container-fluid p-0">
            <a class="navbar-brand logo-texto" href="index.html"><span class="patita">🐾</span> PawFinder</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menú">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menuPrincipal">
                <div class="menu-navegacion ms-lg-auto">
                    <a href="index.html">Inicio</a>
                    <a href="adoptar.html">Adoptar</a>
                    <a href="login.html" class="activo boton-ingreso">Iniciar sesión</a>
                    <a href="registroRefugioYVeterinaria.html" class="boton-donar">Soy Refugio/Veterinaria</a>
                </div>
            </div>
        </nav>
    </header>

    <!-- Envoltorio que da espacio para no taparse con la barra -->
    <div class="contenedor-login-seccion">
        <!-- Tarjeta blanca del formulario -->
        <div class="tarjeta-login">
            <h1 id="textoForm">Inicio de Sesión</h1>
            <form id="formLogin" action="login.php" method="POST">
                <label for="username" class="textoForm">Usuario:</label>
                <input type="text" id="username" name="username" required placeholder="Ingresa Tu Usuario" autofocus><br><br>
                
                <label for="password" class="textoForm">Contraseña:</label>
                <input type="password" id="password" name="password" required placeholder="Ingresa Tu Contraseña"><br><br>
                
                <input type="submit" value="Iniciar Sesión" class="btn-login-submit">
                <input type="button" value="Registrarse" class="btn-login-registro" onclick="window.location.href='registro.html'">
            </form>
        </div>
    </div>

<script>
        document.getElementById('formLogin').addEventListener('submit', function(evento) {
            let usuario = document.getElementById('username').value;
            let contra = document.getElementById('password').value;

            if (usuario === 'admin' && contra === 'admin') {
                evento.preventDefault(); 
                window.location.href = 'admin.html'; 
            }
        });
    </script>
</body>
</html>
